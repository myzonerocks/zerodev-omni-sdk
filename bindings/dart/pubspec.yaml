name: zerodev_aa
description: >-
  Dart and Flutter binding for the ZeroDev Omni SDK — ERC-4337 smart accounts
  on a Zig core, over C FFI. Kernel accounts, gasless UserOperations, custom
  signers, and EIP-7702 delegation.
version: 0.0.1-alpha.1
repository: https://github.com/zerodevapp/zerodev-omni-sdk
issue_tracker: https://github.com/zerodevapp/zerodev-omni-sdk/issues
topics:
  - ethereum
  - account-abstraction
  - erc4337
  - ffi
  - web3

environment:
  sdk: ^3.5.0

dependencies:
  ffi: ^2.1.3
  native_synchronization: ^0.3.1

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.0.0
  test: ^1.25.8
