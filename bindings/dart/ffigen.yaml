# Regenerate the low-level FFI bindings from the C header:
#   dart run ffigen
# The generated file is committed so consumers don't need libclang.
name: AaBindings
description: Low-level FFI bindings for the ZeroDev AA C API (include/aa.h).
output: 'lib/src/ffi/aa_bindings.g.dart'
# Class-based bindings (AaBindings(DynamicLibrary)) so the native library is
# located and opened at runtime by NativeLoader — the same discovery the other
# bindings use — rather than resolved as a build-time native asset.

headers:
  entry-points:
    - '../../include/aa.h'
  include-directives:
    - '**aa.h'

compiler-opts:
  - '-I../../include'

functions:
  include:
    - 'aa_.*'
structs:
  include:
    - 'aa_.*'
enums:
  include:
    - 'aa_.*'
unnamed-enums:
  include:
    - 'AA_.*'
typedefs:
  include:
    - 'aa_.*'

# aa_status / aa_kernel_version / aa_pm_phase are plain C enums, which every
# target compiler (macOS, Linux, Windows, iOS, Android) lays out as a 32-bit
# int. ffigen's size mimicry matches that, so the warning is safe to silence.
silence-enum-warning: true

comments:
  style: any
  length: full

preamble: |
  // GENERATED by package:ffigen from include/aa.h. Do not edit by hand;
  // run `dart run ffigen` to regenerate after the C header changes.
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names, unused_element, unused_field, doc_directive_unknown, no_leading_underscores_for_library_prefixes
